<div class="page">

  <header class="main-header">
    <h1>Liste des activités</h1>
    <p>{{ activities.length }} activité(s) disponible(s)</p>

     <div class="header-actions">
        
    <button class="btn-primary" (click)="onCreateActivity()">
      ➕ Créer activité
    </button>
  </div>
  </header>

  <div class="grid">

    <div class="event-card" *ngFor="let activity of activities">

      <div class="card-content">

        <div class="card-header">
          <h2 class="card-titre">{{ activity.nom }}</h2>
          <span class="badge">{{ activity.type }}</span>
        </div>

        <p class="card-desc">
          {{ activity.description }}
        </p>

        <div class="card-meta">
          <div class="meta-item">
            ⏱ {{ activity.duree }}
          </div>

          <div class="meta-item">
            👥 {{ activity.capacite }} personnes
          </div>
          <div class="action-buttons">

  <button class="icon-btn edit" (click)="editActivity(activity)" title="Modifier">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
      <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
    </svg>
  </button>

  <button class="icon-btn delete" (click)="deleteActivity(activity.idActivity!)" title="Supprimer">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="3 6 5 6 21 6"></polyline>
      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
    </svg>
  </button>

</div>
    </div>
        </div>

      </div>


  </div>

  <div class="empty-state" *ngIf="activities.length === 0">
    <div class="empty-icon">🏕️</div>
    <p>Aucune activité disponible</p>
  </div>

</div>
