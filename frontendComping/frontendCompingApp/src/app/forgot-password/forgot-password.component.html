<div class="forgot-page">

  <div class="forgot-card">

    <!-- ══ LEFT — Image nature ══ -->
    <div class="card-left">
      <div class="card-left-overlay"></div>
      <div class="card-left-content">
        <div class="card-left-logo">
          <svg viewBox="0 0 46 46" xmlns="http://www.w3.org/2000/svg" width="48" height="48">
            <rect width="46" height="46" rx="10" fill="#1b2a4a"/>
            <circle cx="34" cy="9" r="5" fill="#F5C842"/>
            <circle cx="37" cy="7" r="4" fill="#1b2a4a"/>
            <polygon points="3,34 10,20 17,34" fill="#1b4d1b"/>
            <polygon points="13,34 23,15 33,34" fill="#1b4d1b"/>
            <polygon points="27,34 36,20 45,34" fill="#1b4d1b"/>
            <polygon points="15,34 23,17 31,34" fill="#2e7d32"/>
            <polygon points="20,34 23,25 26,34" fill="#e53935"/>
            <rect x="0" y="34" width="46" height="4" fill="#2e7d32"/>
            <rect x="0" y="40" width="12" height="6" fill="#e53935"/>
            <rect x="12" y="40" width="11" height="6" fill="#F5C842"/>
            <rect x="23" y="40" width="11" height="6" fill="#2e7d32"/>
            <rect x="34" y="40" width="12" height="6" fill="#1b2a4a"/>
          </svg>
          <span class="card-left-brand">CAMPI<span>NO</span></span>
        </div>
        <div class="card-left-text">
          <h2>Mot de passe<br>oublié ?</h2>
          <p>Pas de panique ! Récupérez<br>l'accès à votre compte<br>en quelques instants.</p>
        </div>
      </div>
    </div>

    <!-- ══ RIGHT — Formulaire forgot password ══ -->
    <div class="card-right">

      <h1 class="cr-title">Réinitialisation</h1>
      <p class="cr-sub">
        Saisissez votre email pour recevoir un lien de réinitialisation
      </p>

      <form class="cr-form" (ngSubmit)="onSubmit()" #forgotForm="ngForm">

        <!-- Email -->
        <div class="cr-field">
          <input
            id="email"
            type="email"
            class="cr-input"
            [(ngModel)]="email"
            name="email"
            placeholder="Adresse e-mail"
            autocomplete="email"
            required
          />
        </div>

        <!-- Error message -->
        <div class="cr-error" *ngIf="error">
          {{ error }}
        </div>

        <!-- Success message -->
        <div class="cr-success" *ngIf="message">
          {{ message }}
        </div>

        <!-- Submit button -->
        <button type="submit" class="cr-submit" [class.loading]="loading">
          <span *ngIf="!loading">Envoyer le lien</span>
          <span *ngIf="loading" class="cr-loader"></span>
        </button>

      </form>

      <!-- Back to login link -->
      <p class="cr-register">
        Retour à la 
        <a routerLink="/login" class="cr-register-link">connexion</a>
      </p>

    </div>
  </div>

</div>
