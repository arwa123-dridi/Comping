<section class="conversation-page">
  <header class="conversation-top">
    <button class="soft-btn" type="button" (click)="back()">Retour</button>
    <div>
      <span>Messages Campino</span>
      <h1>Conversation privee</h1>
    </div>
    <button class="soft-btn" type="button" (click)="loadMessages()">Actualiser</button>
  </header>

  <div class="alert error" *ngIf="error">{{ error }}</div>

  <main class="messages-panel">
    <article class="message-row" *ngFor="let message of messages" [class.mine]="isMine(message)">
      <div class="bubble">
        <strong>{{ message.expediteurNom }}</strong>
        <p>{{ message.contenu }}</p>
        <small>{{ message.dateCreation | date:'dd/MM HH:mm' }} - {{ message.typeMessage }}</small>
      </div>
    </article>
    <div class="empty-state" *ngIf="!loading && messages.length === 0">Aucun message pour le moment.</div>
  </main>

  <footer class="message-composer">
    <input [(ngModel)]="newMessage" (keyup.enter)="sendMessage()" placeholder="Ecrire un message" />
    <button class="primary-action" type="button" (click)="sendMessage()" [disabled]="sending || !newMessage.trim()">Envoyer</button>
  </footer>
</section>
