<div class="sidebar" [class.collapsed]="isCollapsed">

  <!-- HEADER / LOGO -->
  <div class="sidebar-header">

    <a routerLink="/Campino" class="brand-link" title="Retour à l'accueil">
      <div class="logo-icon">
        <svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="38" height="38" rx="10" fill="#162c40"/>
          <path d="M26 9a5 5 0 0 1-5 5 5 5 0 0 0 5 5 5 5 0 0 0 0-10z" fill="#facc15"/>
          <polygon points="4,30 13,14 22,30" fill="#2d6a4f"/>
          <polygon points="14,30 24,11 34,30" fill="#1b4332"/>
          <rect x="4" y="30" width="30" height="3" rx="1.5" fill="#0a2818"/>
        </svg>
      </div>

      <div class="logo-text">
        CAMPI<span>NO</span>
      </div>
    </a>

    <!-- Bouton toggle TOUJOURS visible -->
    <button class="toggle-btn" (click)="toggleSidebar()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>

  </div>

  <!-- MENU -->
  <nav class="menu">

    <a routerLink="/admin/dashboard" routerLinkActive="active" title="Dashboard">
      <span class="icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/>
          <rect x="14" y="3" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/>
        </svg>
      </span>
      <span class="label">Dashboard</span>
    </a>

    <a routerLink="/admin/securite" routerLinkActive="active" title="Sécurité">
      <span class="icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
      </span>
      <span class="label">Sécurité</span>
    </a>

    <a routerLink="/admin/urgences" routerLinkActive="active" title="Urgences Avancées">
      <span class="icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 0 1-8 0"/>
        </svg>
      </span>
      <span class="label">Urgences Av.</span>
    </a>

    <a routerLink="/admin/incidents" routerLinkActive="active" title="Incidents">
      <span class="icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
        </svg>
      </span>
      <span class="label">Incidents</span>
    </a>

    <a routerLink="/admin/alertes" routerLinkActive="active" title="Urgence / Alertes">
      <span class="icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
      </span>
      <span class="label">Urgence</span>
    </a>

    <a routerLink="/admin/ai-chatbot" routerLinkActive="active" title="AI Assistant">
      <span class="icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          <circle cx="9" cy="10" r="1"/>
          <circle cx="12" cy="10" r="1"/>
          <circle cx="15" cy="10" r="1"/>
        </svg>
      </span>
      <span class="label">AI Chat</span>
    </a>

  </nav>

</div>
