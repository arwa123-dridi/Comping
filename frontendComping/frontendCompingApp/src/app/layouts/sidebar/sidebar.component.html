<div class="sidebar" [class.collapsed]="isCollapsed">

  <!-- HEADER / LOGO -->
  <div class="sidebar-header">

    <!-- Icône SVG toujours visible -->
    <div class="logo-icon">
      <svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="38" height="38" rx="10" fill="#162c40"/>
        <path d="M26 9a5 5 0 0 1-5 5 5 5 0 0 0 5 5 5 5 0 0 0 0-10z" fill="#facc15"/>
        <polygon points="4,30 13,14 22,30" fill="#2d6a4f"/>
        <polygon points="14,30 24,11 34,30" fill="#1b4332"/>
        <rect x="4" y="30" width="30" height="3" rx="1.5" fill="#0a2818"/>
      </svg>
    </div>

    <!-- Texte caché par CSS en collapsed -->
    <div class="logo-text">
      CAMPI<span>NO</span>
    </div>

    <!-- Bouton toggle TOUJOURS visible -->
    <button class="toggle-btn" (click)="toggleSidebar()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>

  </div>

  <!-- MENU Randonner Module -->
  <nav class="menu">

    <!-- Dashboard -->
    <a routerLink="/dashboard" routerLinkActive="active" title="Dashboard User">
      <span class="icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/>
          <rect x="14" y="3" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/>
        </svg>
      </span>
      <span class="label">Dashboard</span>
    </a>

    <!-- Randonnées User -->
    <a *ngIf="isUser()" routerLink="/sorties" routerLinkActive="active" title="Randonnées">
      <span class="icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L4.5 13.5L8.5 21l8-8L20.5 10.5z"/>
        </svg>
      </span>
      <span class="label">Randonnées</span>
    </a>

    <!-- Équipes User -->
    <a *ngIf="isUser()" routerLink="/equipes" routerLinkActive="active" title="Équipes">
      <span class="icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="8.5" cy="7" r="4"/>
          <polyline points="17 11 19 13 23 9"/>
        </svg>
      </span>
      <span class="label">Équipes</span>
    </a>

    <!-- Admin Dashboard -->
<a *ngIf="isAdmin()" routerLink="/admin/dashboard" routerLinkActive="active">
      <span class="icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L4.5 13.5L8.5 21l8-8L20.5 10.5z"/>
        </svg>
      </span>
      <span class="label">Dashboard Admin</span>
    </a>

    <!-- Randonnées Admin -->
    <a *ngIf="isAdmin()" routerLink="/sorties" routerLinkActive="active" title="Gérer Randonnées">
      <span class="icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/>
          <circle cx="10" cy="8" r="4"/>
        </svg>
      </span>
      <span class="label">Gérer Randonnées</span>
    </a>

    <!-- Équipes Admin -->
    <a *ngIf="isAdmin()" routerLink="/equipes" routerLinkActive="active" title="Gérer Équipes">
      <span class="icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
      </span>
      <span class="label">Gérer Équipes</span>
    </a>

    <!-- Existing generic links -->
    <a routerLink="/admin/emplacements" routerLinkActive="active" title="Emplacements">
      <span class="icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
      </span>
      <span class="label">Utilisateurs</span>
    </a>

    <a routerLink="/admin/materiel" routerLinkActive="active" title="Matériel">
      <span class="icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 0 1-8 0"/>
        </svg>
      </span>
      <span class="label">Activities</span>
    </a>

  </nav>

</div>
