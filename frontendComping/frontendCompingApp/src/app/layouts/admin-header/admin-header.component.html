<div class="header">

  <!-- LEFT: Toggle + Search -->
  <div class="header-left">
    <button class="menu-toggle" (click)="toggleSidebar()">
      <span></span><span></span><span></span>
    </button>
    <div class="search-bar">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="text" placeholder="Rechercher…" />
      <span class="search-shortcut">⌘K</span>
    </div>
  </div>

  <!-- RIGHT: Actions + User -->
  <div class="header-right">

    <!-- Dark mode -->
    <button class="icon-btn" (click)="toggleTheme()" [title]="isDark ? 'Mode clair' : 'Mode sombre'">
      <svg *ngIf="!isDark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="5"/>
        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
      </svg>
      <svg *ngIf="isDark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>

    <!-- Notifications -->
    <div class="dropdown-wrapper">
      <button class="icon-btn" (click)="toggleNotif()" title="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span class="badge" *ngIf="notifCount > 0">{{ notifCount }}</span>
      </button>
      <div class="dropdown notif-dropdown" *ngIf="showNotif">
        <div class="dropdown-header">
          <span>Notifications</span>
          <button class="mark-all" (click)="clearNotifs()" *ngIf="notifCount > 0">Tout lire</button>
        </div>
        <div class="notif-item" *ngFor="let n of notifications" [class.unread]="!n.lu" (click)="selectNotif(n)">
          <div class="notif-dot"></div>
          <div class="notif-content">
            <p>{{ n.titre }}</p>
            <span>{{ n.dateCreation | date:'short' }}</span>
          </div>
        </div>
        <div class="notif-item" *ngIf="notifications.length === 0">
          <div class="notif-content">
            <p>Aucune notification</p>
          </div>
        </div>
      </div>
    </div>

    <!-- User menu -->
    <div class="dropdown-wrapper">
      <div class="user-menu" (click)="toggleUserMenu()">
        <div class="avatar avatar-initiales">{{ userInitiales }}</div>
        <div class="user-info">
          <span class="user-name">{{ userName }}</span>
          <span class="user-role">{{ getRoleLabel() }}</span>
        </div>
        <svg class="chevron" [class.open]="showUserMenu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </div>

      <div class="dropdown user-dropdown" *ngIf="showUserMenu">
        <div class="user-dropdown-header">
          <div class="avatar-lg avatar-initiales-lg">{{ userInitiales }}</div>
          <div>
            <p class="ud-name">{{ userName }}</p>
            <p class="ud-email">{{ userEmail }}</p>
          </div>
        </div>
        <a class="dropdown-item" routerLink="/profile" (click)="closeAll()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          Mon profil
        </a>
        <a class="dropdown-item" routerLink="/planning" (click)="closeAll()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          Mon Planning
        </a>
        <div class="dropdown-divider"></div>
        <button class="dropdown-item logout" (click)="logout()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Se déconnecter
        </button>
      </div>
    </div>

    <div class="overlay" *ngIf="showNotif || showUserMenu" (click)="closeAll()"></div>
  </div>
</div>
