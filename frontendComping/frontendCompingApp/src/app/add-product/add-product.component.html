<div class="modal-backdrop">

  <div class="modal-card">

    <!-- HEADER -->
    <div class="modal-header">
      <div>
        <h2>🌿 Produit de camping</h2>
        <p class="subtitle">Ajouter ou modifier un équipement outdoor</p>
      </div>

      <button class="close-btn" (click)="cancel()">✖</button>
    </div>

    <form (ngSubmit)="saveProduct()" class="modal-form">

      <!-- ================= SECTION 1 ================= -->
      <div class="form-section">
        <h3>Informations générales</h3>

        <div class="grid-2">
          <div class="field">
            <label>Nom du produit</label>
            <input type="text" [(ngModel)]="product.nomProduit" name="nomProduit" required />
          </div>

          <div class="field">
            <label>Prix (TND)</label>
            <input type="number" [(ngModel)]="product.prixProduit" name="prixProduit" required />
          </div>
        </div>

        <div class="field">
          <label>Description</label>
          <textarea [(ngModel)]="product.descriptionProduit" name="descriptionProduit"></textarea>
        </div>
      </div>

      <!-- ================= SECTION 2 ================= -->
      <div class="form-section">
        <h3>Classification & Stock</h3>

        <div class="grid-3">
          <div class="field">
            <label>Catégorie</label>
            <select [(ngModel)]="product.categorieProduit" name="categorieProduit">
              <option [ngValue]="null">Choisir</option>
              <option *ngFor="let cat of categories" [ngValue]="cat.value">
                {{ cat.label }}
              </option>
            </select>
          </div>

          <div class="field">
            <label>Stock</label>
            <input type="number" [(ngModel)]="product.quantiteStock" name="quantiteStock" />
          </div>

          <div class="field">
            <label>Seuil alerte</label>
            <input type="number" [(ngModel)]="product.seuilAlerteStock" name="seuilAlerteStock" />
          </div>
        </div>
      </div>

      <!-- ================= SECTION 3 ================= -->
      <div class="form-section">
        <h3>Image produit</h3>

        <div class="upload-box" (click)="fileInput.click()">
          <input #fileInput type="file" (change)="onFileSelected($event)" hidden />

          <div *ngIf="!product.imageUrl" class="upload-placeholder">
            ⛺
            <p>Importer une image camping</p>
          </div>

          <div *ngIf="product.imageUrl" class="image-preview">
            <img [src]="product.imageUrl" />
            <button type="button" class="remove-btn" (click)="removeImage($event)">✖</button>
          </div>
        </div>
      </div>

      <!-- ================= SECTION 4 ================= -->
      <div class="form-section">
        <h3>Promotion (optionnel)</h3>

        <div class="grid-3">

          <div class="field">
            <label>Prix promo</label>
            <input type="number" [(ngModel)]="product.promoPrice" name="promoPrice" />
          </div>

          <div class="field">
            <label>Date début promo</label>
            <input type="datetime-local" [(ngModel)]="product.promoStart" name="promoStart" />
          </div>

          <div class="field">
            <label>Date fin promo</label>
            <input type="datetime-local" [(ngModel)]="product.promoEnd" name="promoEnd" />
          </div>

        </div>
      </div>

      <!-- ACTIONS -->
      <div class="modal-actions">
        <button type="submit" class="save-btn">✔ Enregistrer</button>
        <button type="button" class="cancel-btn" (click)="cancel()">Annuler</button>
      </div>

    </form>
  </div>
</div>
