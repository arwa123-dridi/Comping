<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-sm">
        <div class="card-header bg-success text-white">
          <h3 class="mb-0">✨ Créer une nouvelle randonnée</h3>
        </div>
        
        <div class="card-body">
          <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
          
          <form (ngSubmit)="onSubmit()">
            <!-- Titre -->
            <div class="mb-3">
              <label class="form-label">Titre *</label>
              <input type="text" class="form-control" [(ngModel)]="sortie.titre" name="titre" required>
            </div>
            
            <!-- Description -->
            <div class="mb-3">
              <label class="form-label">Description *</label>
              <textarea class="form-control" rows="3" [(ngModel)]="sortie.description" name="description" required></textarea>
            </div>
            
            <div class="row">
              <!-- Date début -->
              <div class="col-md-6 mb-3">
                <label class="form-label">Date de début *</label>
                <input type="datetime-local" class="form-control" [(ngModel)]="sortie.dateDebut" name="dateDebut" required>
              </div>
              
              <!-- Date fin -->
              <div class="col-md-6 mb-3">
                <label class="form-label">Date de fin</label>
                <input type="datetime-local" class="form-control" [(ngModel)]="sortie.dateFin" name="dateFin">
              </div>
            </div>
            
            <div class="row">
              <!-- Lieu départ -->
              <div class="col-md-6 mb-3">
                <label class="form-label">Lieu de départ *</label>
                <input type="text" class="form-control" [(ngModel)]="sortie.lieuDepart" name="lieuDepart" required>
              </div>
              
              <!-- Région -->
              <div class="col-md-6 mb-3">
                <label class="form-label">Région</label>
                <input type="text" class="form-control" [(ngModel)]="sortie.region" name="region">
              </div>
            </div>
            
            <div class="row">
              <!-- Difficulté -->
              <div class="col-md-4 mb-3">
                <label class="form-label">Difficulté *</label>
                <select class="form-select" [(ngModel)]="sortie.difficulte" name="difficulte">
                  <option *ngFor="let d of difficulteOptions" [value]="d">{{ d }}</option>
                </select>
              </div>
              
              <!-- Capacité -->
              <div class="col-md-4 mb-3">
                <label class="form-label">Capacité max *</label>
                <input type="number" class="form-control" [(ngModel)]="sortie.capaciteMax" name="capaciteMax" min="1" max="50">
              </div>
              
              <!-- Prix -->
              <div class="col-md-4 mb-3">
                <label class="form-label">Prix (TND)</label>
                <input type="number" class="form-control" [(ngModel)]="sortie.prixParPersonne" name="prix" step="0.5" min="0">
              </div>
            </div>
            
            <!-- Équipement requis -->
            <div class="mb-3">
              <label class="form-label">Équipement requis</label>
              <textarea class="form-control" rows="2" [(ngModel)]="sortie.equipementRequis" name="equipement" placeholder="Tente, sac de couchage, bâtons..." ></textarea>
            </div>
            
            <!-- Assistance médicale -->
            <div class="mb-3 form-check">
              <input type="checkbox" class="form-check-input" [(ngModel)]="sortie.assistanceMedicale" name="assistanceMedicale">
              <label class="form-check-label">Assistance médicale disponible</label>
            </div>
            
            <hr>
            
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-success" [disabled]="loading">
                <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                Créer la randonnée
              </button>
              <button type="button" class="btn btn-secondary" (click)="cancel()">Annuler</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
