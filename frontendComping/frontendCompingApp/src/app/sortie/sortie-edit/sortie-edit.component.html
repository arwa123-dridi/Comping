<!-- src/app/sortie/sortie-edit/sortie-edit.component.html -->
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-sm">
        <div class="card-header bg-warning text-dark">
          <h3 class="mb-0">✏️ Modifier la randonnée</h3>
        </div>
        
        <div class="card-body">
          <div *ngIf="loading" class="text-center py-5">
            <div class="spinner-border text-warning"></div>
            <p class="mt-2">Chargement...</p>
          </div>
          
          <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
          
          <form *ngIf="!loading" (ngSubmit)="onSubmit()">
            <!-- Titre -->
            <div class="mb-3">
              <label class="form-label">Titre *</label>
              <input type="text" class="form-control" [(ngModel)]="sortie.titre" name="titre" required>
            </div>
            
            <!-- Description -->
            <div class="mb-3">
              <label class="form-label">Description *</label>
              <textarea class="form-control" rows="3" [(ngModel)]="sortie.description" name="description" required></textarea>
            </div>
            
            <!-- Dates -->
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Date de début *</label>
                <input type="datetime-local" class="form-control" [(ngModel)]="sortie.dateDebut" name="dateDebut" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Date de fin</label>
                <input type="datetime-local" class="form-control" [(ngModel)]="sortie.dateFin" name="dateFin">
              </div>
            </div>
            
            <!-- Lieux -->
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Lieu de départ *</label>
                <input type="text" class="form-control" [(ngModel)]="sortie.lieuDepart" name="lieuDepart" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Région</label>
                <input type="text" class="form-control" [(ngModel)]="sortie.region" name="region">
              </div>
            </div>
            
            <!-- Caractéristiques -->
            <div class="row">
              <div class="col-md-4 mb-3">
                <label class="form-label">Difficulté</label>
                <select class="form-select" [(ngModel)]="sortie.difficulte" name="difficulte">
                  <option *ngFor="let d of difficulteOptions" [value]="d">{{ d }}</option>
                </select>
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label">Capacité max</label>
                <input type="number" class="form-control" [(ngModel)]="sortie.capaciteMax" name="capaciteMax" min="1" max="50">
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label">Prix (TND)</label>
                <input type="number" class="form-control" [(ngModel)]="sortie.prixParPersonne" name="prix" min="0">
              </div>
            </div>
            
            <!-- Équipement requis -->
            <div class="mb-3">
              <label class="form-label">Équipement requis</label>
              <textarea class="form-control" rows="2" [(ngModel)]="sortie.equipementRequis" name="equipement" placeholder="Ex: chaussures de randonnée, bâtons, ..."></textarea>
            </div>
            
            <!-- Assistance médicale -->
            <div class="mb-3 form-check">
              <input type="checkbox" class="form-check-input" [(ngModel)]="sortie.assistanceMedicale" name="assistanceMedicale" id="assistance">
              <label class="form-check-label" for="assistance">Assistance médicale disponible</label>
            </div>
            
            <hr>
            
            <!-- Boutons -->
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-warning" [disabled]="loading">
                <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                💾 Enregistrer les modifications
              </button>
              <button type="button" class="btn btn-secondary" (click)="cancel()">❌ Annuler</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
