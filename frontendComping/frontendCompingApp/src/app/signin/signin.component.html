<div class="signin-page">

  <div class="signin-card">

    <!-- ══ LEFT — Image nature ══ -->
    <div class="card-left">
      <div class="card-left-overlay"></div>
      <div class="card-left-content">
        <div class="card-left-logo">
          <svg viewBox="0 0 46 46" xmlns="http://www.w3.org/2000/svg" width="48" height="48">
            <rect width="46" height="46" rx="10" fill="#1b2a4a"/>
            <circle cx="34" cy="9" r="5" fill="#F5C842"/>
            <circle cx="37" cy="7" r="4" fill="#1b2a4a"/>
            <polygon points="3,34 10,20 17,34" fill="#1b4d1b"/>
            <polygon points="13,34 23,15 33,34" fill="#1b4d1b"/>
            <polygon points="27,34 36,20 45,34" fill="#1b4d1b"/>
            <polygon points="15,34 23,17 31,34" fill="#2e7d32"/>
            <polygon points="20,34 23,25 26,34" fill="#e53935"/>
            <rect x="0" y="34" width="46" height="4" fill="#2e7d32"/>
            <rect x="0" y="40" width="12" height="6" fill="#e53935"/>
            <rect x="12" y="40" width="11" height="6" fill="#F5C842"/>
            <rect x="23" y="40" width="11" height="6" fill="#2e7d32"/>
            <rect x="34" y="40" width="12" height="6" fill="#1b2a4a"/>
          </svg>
          <span class="card-left-brand">CAMPI<span>NO</span></span>
        </div>
        <div class="card-left-text">
          <h2>Bon retour<br>parmi nous !</h2>
          <p>Reconnectez-vous et reprenez<br>votre aventure là où vous<br>l'avez laissée.</p>
        </div>
      </div>
    </div>

    <!-- ══ RIGHT — Formulaire login ══ -->
    <div class="card-right">

      <h1 class="cr-title">Connexion</h1>
      <p class="cr-sub">
        Connectez-vous à votre compte CAMPINO
      </p>

      <form class="cr-form" (ngSubmit)="onSubmit()" #loginForm="ngForm">

        <!-- Email -->
        <div class="cr-field">
          <input
            id="email"
            type="email"
            class="cr-input"
            [(ngModel)]="email"
            name="email"
            placeholder="Adresse e-mail"
            autocomplete="email"
            required
          />
        </div>

        <!-- Password -->
        <div class="cr-field">
          <div class="cr-input-wrap">
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              class="cr-input"
              [(ngModel)]="password"
              name="password"
              placeholder="Mot de passe"
              autocomplete="current-password"
              required
            />
            <button type="button" class="cr-eye" (click)="togglePassword()">
              <svg *ngIf="!showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg *ngIf="showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Options -->
        <div class="cr-options">
          <label class="cr-remember">
            <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe" />
            <span class="cr-checkbox"></span>
            Se souvenir de moi
          </label>
          <a routerLink="/forgot-password" class="cr-forgot">Mot de passe oublié ?</a>
        </div>

        <!-- Error -->
        <div class="cr-error" *ngIf="errorMsg">
          {{ errorMsg }}
        </div>

        <!-- Submit -->
        <button type="submit" class="cr-submit" [class.loading]="isLoading">
          <span *ngIf="!isLoading">Se connecter</span>
          <span *ngIf="isLoading" class="cr-loader"></span>
        </button>

      </form>

      <!-- Divider -->
      <div class="cr-divider"><span>ou</span></div>

      <!-- Social -->
      <div class="cr-socials">
        <button type="button" class="cr-social">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Google
        </button>
        <button type="button" class="cr-social">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#1877F2">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
          Facebook
        </button>
      </div>

      <!-- Register link -->
      <p class="cr-register">
        Pas encore de compte ?
        <a routerLink="/signup" class="cr-register-link">S'inscrire gratuitement</a>
      </p>

    </div>
  </div>

</div>
