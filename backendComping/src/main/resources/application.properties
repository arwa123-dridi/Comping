spring.application.name=backendComping

spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/Comping}
spring.data.mongodb.database=Comping
spring.data.mongodb.auto-index-creation=true
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
spring.devtools.restart.enabled=false



server.port=8087


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=ahmetchaouch19@gmail.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

spring.mail.properties.mail.debug=true

logging.level.tn.comping.spring.backendcomping=DEBUG
logging.level.org.springframework.security=DEBUG

