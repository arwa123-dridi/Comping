spring.application.name=backendComping
spring.config.import=optional:dotenv:.

# ================= SERVER =================
server.port=8087

server.error.include-message=always
server.error.include-binding-errors=always

# ================= MONGODB =================
spring.data.mongodb.uri=mongodb://localhost:27017/Comping
spring.data.mongodb.database=Comping
spring.data.mongodb.auto-index-creation=true

logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

# ================= MAIL CONFIGURATION =================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# ================= LOGGING =================
logging.level.tn.comping.spring.backendcomping=DEBUG
logging.level.org.springframework.security=DEBUG

# ================= FILE UPLOAD =================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=./uploads/voice

# ================= STRIPE =================
stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

# ================= CLOUDINARY =================
cloudinary.cloud.name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api.key=${CLOUDINARY_API_KEY}
cloudinary.api.secret=${CLOUDINARY_API_SECRET}

# ================= IA API =================
ia.api.url=http://localhost:5000/recommend
ia.api.timeout=5000

# ================= GROQ AI =================
groq.api.key=${GROQ_API_KEY:your-groq-api-key-here}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama-3.3-70b-versatile

# ================= YOUTUBE API =================
youtube.api.key=${YOUTUBE_API_KEY:your-youtube-api-key-here}

# ================= RSS FEEDS =================
ai.rss.feeds=https://www.rei.com/blog/feed,https://www.outdoorlife.com/feed,https://thedyrt.com/feed

# ================= CACHE =================
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=21600s