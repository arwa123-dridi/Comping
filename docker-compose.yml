services:
  mongo:
    image: mongo:7
    container_name: camping-mongo
    ports:
      - "27017:27017"
    volumes:
      - camping-mongo-data:/data/db
    networks:
      - camping-network

  backend:
    build:
      context: ./backendComping
    container_name: camping-backend
    ports:
      - "8087:8087"
    environment:
      MONGO_URI: mongodb://camping-mongo:27017/Comping
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
    depends_on:
      - mongo
    networks:
      - camping-network

  frontend:
    build:
      context: ./frontendComping/frontendCompingApp
    container_name: camping-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - camping-network

networks:
  camping-network:
    driver: bridge

volumes:
  camping-mongo-data:
