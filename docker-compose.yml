services:

  mongo:
    image: mongo:6
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backendComping
      dockerfile: Dockerfile.backend
    image: backendcomping:latest
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "8087:8087"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/Comping
      SPRING_DATA_MONGODB_DATABASE: Comping

  frontend:
    build:
      context: ./frontendComping
      dockerfile: Dockerfile.frontend
    image: frontendcomping:latest
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  mongo_data: