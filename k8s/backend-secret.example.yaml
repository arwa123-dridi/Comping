# Copy to backend-secret.yaml, fill in real values, and apply it before backend.yaml.
# backend-secret.yaml is gitignored — never commit real secrets.
# JWT_SECRET must never be left empty: an empty string overrides the app's built-in
# default (unlike an absent key) and JWT signing fails with a 0-bit key error.
apiVersion: v1
kind: Secret
metadata:
  name: comping-backend-secret
type: Opaque
stringData:
  MAIL_USERNAME: ""
  MAIL_PASSWORD: ""
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  CLOUDINARY_CLOUD_NAME: ""
  CLOUDINARY_API_KEY: ""
  CLOUDINARY_API_SECRET: ""
  JWT_SECRET: "compingSecretKeyForJWTMustBe256BitsLongAtLeast!!"
