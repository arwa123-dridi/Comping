apiVersion: v1
kind: ConfigMap
metadata:
  name: comping-backend-config
data:
  MONGO_URI: mongodb://mongo:27017/Comping
  IA_API_URL: http://localhost:5000/predict
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: <dockerhub-user>/comping-backend:latest
          ports:
            - containerPort: 8087
          envFrom:
            - configMapRef:
                name: comping-backend-config
            - secretRef:
                name: comping-backend-secret
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8087
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8087
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - port: 8087
      targetPort: 8087
